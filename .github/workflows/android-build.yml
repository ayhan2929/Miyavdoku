name: Meyve Kesme Android Build
'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android test and APK build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract game project
        shell: bash
        run: |
          set -euo pipefail
          unzip -o MeyveKesme_MiyavDoku_GitHub_Yukleme.zip
          test -f MeyveKesme/gradlew
          test -f MeyveKesme/app/build.gradle

      - name: Apply Turkish localization
        run: python3 localization/apply_turkish.py MeyveKesme

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1'

      - name: Run unit tests
        working-directory: MeyveKesme
        run: chmod +x ./gradlew && ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: MeyveKesme
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meyve-kesme-debug-apk
          path: MeyveKesme/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
